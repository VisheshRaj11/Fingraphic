version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fingraphic_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: fingraphic_user
      MONGO_INITDB_ROOT_PASSWORD: fingraphic_pass
      MONGO_INITDB_DATABASE: fingraphic_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fingraphic_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
